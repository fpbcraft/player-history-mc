plugins { id 'base'; id 'net.neoforged.moddev' version '2.0.146' apply false }

def releaseVersion = providers.environmentVariable('RELEASE_VERSION').orNull

def buildVersion
if (releaseVersion) {
    buildVersion = releaseVersion
} else {
    def gitSha = providers.environmentVariable('GITHUB_SHA').orNull
    if (!gitSha) {
        gitSha = ['git', 'rev-parse', '--short=8', 'HEAD']
                .execute(null, rootDir)
                .text
                .trim()
    }
    if (!(gitSha ==~ /[0-9a-fA-F]{7,40}/)) {
        throw new GradleException("Could not determine Git SHA for immutable development version")
    }
    def tagOutput = ['git', 'tag', '--merged', 'HEAD', '--list', 'v*']
            .execute(null, rootDir)
            .text
            .readLines()
            .findAll { it ==~ /v\d+\.\d+\.\d+/ }
    if (tagOutput.isEmpty()) {
        throw new GradleException("Could not determine stable release tag for development version")
    }
    def baseVersion = tagOutput
            .collect { tag -> tag.substring(1).tokenize('.').collect { it as int } }
            .max { left, right ->
                left[0] <=> right[0] ?: left[1] <=> right[1] ?: left[2] <=> right[2]
            }
            .join('.')
    buildVersion = "${baseVersion}-dev.${gitSha.take(8).toLowerCase()}"
}

allprojects {
    version = buildVersion
    group = 'dev.playerhistory'
    repositories { mavenCentral() }
}

tasks.register('test') { dependsOn ':recorder-neoforge:test', ':bluemap-neoforge:test' }
tasks.named('build') { dependsOn ':recorder-neoforge:build', ':bluemap-neoforge:build' }
