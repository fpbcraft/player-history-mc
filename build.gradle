plugins { id 'base'; id 'net.neoforged.moddev' version '2.0.146' apply false }

def gitShortSha = providers.exec {
 commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
}.standardOutput.asText.map { it.trim() }

def buildVersion = providers.environmentVariable('PLAYER_HISTORY_VERSION').orElse(
 providers.gradleProperty('modVersion').zip(gitShortSha) { base, sha -> "${base}-dev.${sha}" }
)

allprojects {
 version = buildVersion.get()
 group = 'dev.playerhistory'
 repositories { mavenCentral() }
}

tasks.register('test') { dependsOn ':recorder-neoforge:test', ':bluemap-neoforge:test' }
tasks.named('build') { dependsOn ':recorder-neoforge:build', ':bluemap-neoforge:build' }
