plugins { id 'base'; id 'net.neoforged.moddev' version '2.0.146' apply false }

def configuredVersion = providers.gradleProperty('modVersion').get()
def versionOverride = System.getenv('PLAYER_HISTORY_VERSION')?.trim()
def effectiveVersion
if (versionOverride) {
  effectiveVersion = versionOverride
} else {
  def gitSha = providers.exec {
    commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
  }.standardOutput.asText.get().trim()
  effectiveVersion = "${configuredVersion}-dev.g${gitSha}"
}

allprojects {
  version = effectiveVersion
  group = 'dev.playerhistory'
  repositories { mavenCentral() }
}
tasks.register('test') { dependsOn ':recorder-neoforge:test', ':bluemap-neoforge:test' }
tasks.named('build') { dependsOn ':recorder-neoforge:build', ':bluemap-neoforge:build' }
