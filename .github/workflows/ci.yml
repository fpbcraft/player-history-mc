name: CI

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bluemap-addon/package-lock.json

      - name: Resolve immutable build version
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          version="$(python3 scripts/release_version.py dev --sha "$SOURCE_SHA")"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "PLAYER_HISTORY_VERSION=$version" >> "$GITHUB_ENV"
      - name: Check release version tooling
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Install viewer dependencies
        working-directory: bluemap-addon
        run: npm ci
      - name: Check viewer
        working-directory: bluemap-addon
        run: npm run check

      - name: Build and test mods
        run: |
          chmod +x gradlew
          ./gradlew test build --no-daemon

      - name: Upload test jars
        uses: actions/upload-artifact@v4
        with:
          name: player-history-${{ env.RELEASE_VERSION }}
          path: |
            recorder-neoforge/build/libs/*.jar
            bluemap-neoforge/build/libs/*.jar
          if-no-files-found: error

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bluemap-addon/package-lock.json

      - name: Install viewer dependencies
        working-directory: bluemap-addon
        run: npm ci
      - name: Capture deterministic viewer screenshots
        working-directory: bluemap-addon
        run: npm run visual:test
      - name: Upload viewer visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-history-visual-${{ github.run_id }}
          path: bluemap-addon/visual-output/
          if-no-files-found: warn

  publish-visual-pages:
    name: Publish visual Pages
    needs: visual
    if: >-
      ${{
        needs.visual.result == 'success' &&
        (
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: player-history-visual-pages
      cancel-in-progress: false
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Checkout Pages storage
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: visual-pages
          fetch-depth: 1

      - name: Download visual screenshots
        uses: actions/download-artifact@v5
        with:
          name: player-history-visual-${{ github.run_id }}
          path: visual-output

      - name: Initialize visual Pages storage
        shell: bash
        run: |
          if [[ ! -f visual-pages/.player-history-visual-pages ]]; then
            find visual-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            touch visual-pages/.player-history-visual-pages
            touch visual-pages/.nojekyll
          fi

      - name: Resolve visual preview metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          base_url="https://${owner}.github.io/${repo}"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            target="pr/${PR_NUMBER}"
            label="PR #${PR_NUMBER}"
            source_sha="$PR_HEAD_SHA"
          else
            target="main"
            label="main"
            source_sha="$GITHUB_SHA"
          fi

          {
            echo "VISUAL_TARGET=${target}"
            echo "VISUAL_LABEL=${label}"
            echo "SOURCE_SHA=${source_sha}"
            echo "PREVIEW_URL=${base_url}/${target}/"
            echo "PAGES_ROOT_URL=${base_url}/"
          } >> "$GITHUB_ENV"

      - name: Build visual Pages gallery
        env:
          VISUAL_SOURCE: ${{ github.workspace }}/visual-output
          PAGES_ROOT: ${{ github.workspace }}/visual-pages
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: node scripts/update_visual_pages.mjs

      - name: Publish visual Pages branch
        working-directory: visual-pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Visual Pages content is unchanged."
            exit 0
          fi
          git commit -m "Publish visual preview for ${VISUAL_LABEL}"
          git push origin HEAD:gh-pages

      - name: Add visual preview link to pull request
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker="<!-- player-history-visual-preview -->"
          short_sha="${SOURCE_SHA:0:8}"
          body="$(cat <<EOF
          ${marker}
          ### Visual test preview

          [Open the screenshot gallery on GitHub Pages](${PREVIEW_URL})

          Updated for \`${short_sha}\` · [CI run](${RUN_URL})
          EOF
          )"

          comment_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"               --paginate               --jq '.[] | select(.body | contains("<!-- player-history-visual-preview -->")) | .id'               | head -n 1
          )"

          if [[ -n "$comment_id" ]]; then
            gh api               --method PATCH               "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}"               --raw-field body="$body"               >/dev/null
          else
            gh api               --method POST               "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"               --raw-field body="$body"               >/dev/null
          fi
