name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bluemap-addon/package-lock.json

      - name: Resolve immutable development version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          fallback="$(sed -n 's/^modVersion=//p' gradle.properties | head -n 1)"
          version="$(python3 scripts/release_version.py             --development             --fallback "$fallback"             --sha "$GITHUB_SHA")"
          echo "PLAYER_HISTORY_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Check release tooling
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Install viewer dependencies
        working-directory: bluemap-addon
        run: npm ci

      - name: Check viewer
        working-directory: bluemap-addon
        run: npm run check

      - name: Build and test mods
        run: |
          chmod +x gradlew
          ./gradlew test build --no-daemon

      - name: Upload test jars
        uses: actions/upload-artifact@v4
        with:
          name: player-history-${{ steps.version.outputs.version }}
          path: |
            recorder-neoforge/build/libs/*.jar
            bluemap-neoforge/build/libs/*.jar
          if-no-files-found: error
