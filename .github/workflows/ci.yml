name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bluemap-addon/package-lock.json

      - name: Resolve immutable build version
        id: version
        shell: bash
        run: |
          BASE="$(sed -n 's/^modVersion=//p' gradle.properties)"
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          VERSION="${BASE}-dev.${SHORT_SHA}"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "PLAYER_HISTORY_VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Validate release tooling
        shell: bash
        run: |
          python3 -m py_compile .github/scripts/release_version.py
          BASE="$(sed -n 's/^modVersion=//p' gradle.properties)"
          python3 .github/scripts/release_version.py next \
            --increment patch \
            --fallback "${BASE}" \
            --github-output /tmp/player-history-release-version

      - name: Install viewer dependencies
        working-directory: bluemap-addon
        run: npm ci
      - name: Check viewer
        working-directory: bluemap-addon
        run: npm run check

      - name: Build and test mods
        run: |
          chmod +x gradlew
          ./gradlew test build --no-daemon

      - name: Upload test jars
        uses: actions/upload-artifact@v4
        with:
          name: player-history-${{ steps.version.outputs.value }}
          path: |
            recorder-neoforge/build/libs/*.jar
            bluemap-neoforge/build/libs/*.jar
          if-no-files-found: error
