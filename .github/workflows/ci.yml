name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bluemap-addon/package-lock.json

      - name: Resolve immutable build version
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          version="$(python3 scripts/release_version.py dev --sha "$SOURCE_SHA")"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "PLAYER_HISTORY_VERSION=$version" >> "$GITHUB_ENV"
      - name: Check release version tooling
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Install viewer dependencies
        working-directory: bluemap-addon
        run: npm ci
      - name: Check viewer
        working-directory: bluemap-addon
        run: npm run check

      - name: Build and test mods
        run: |
          chmod +x gradlew
          ./gradlew test build --no-daemon
          python3 scripts/verify_diorama_jar.py

      - name: Upload test jars
        uses: actions/upload-artifact@v4
        with:
          name: player-history-${{ env.RELEASE_VERSION }}
          path: |
            recorder-neoforge/build/libs/*.jar
            bluemap-neoforge/build/libs/*.jar
            motd-neoforge/build/libs/*.jar
            public-assets-neoforge/build/libs/*.jar
          if-no-files-found: error

  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bluemap-addon/package-lock.json

      - name: Install viewer dependencies
        working-directory: bluemap-addon
        run: npm ci
      - name: Install Chrome for visual checks
        uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Capture deterministic viewer screenshots
        working-directory: bluemap-addon
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run visual:test
      - name: Check out Diorama web API fixture source
        uses: actions/checkout@v5
        with:
          repository: fpbcraft/diorama
          ref: 5ea2e8436a645d7c022e3746d1b50f955151e8ac
          path: diorama-fixture
      - name: Check Diorama viewer in the browser
        working-directory: bluemap-addon
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          DIORAMA_ROOT: ${{ github.workspace }}/diorama-fixture
        run: npm run build && npm run visual:diorama
      - name: Upload viewer visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-history-visual-${{ github.run_id }}
          path: bluemap-addon/visual-output/
          if-no-files-found: warn
