name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bluemap-addon/package-lock.json
      - name: Install viewer dependencies
        working-directory: bluemap-addon
        run: npm ci
      - name: Check viewer
        working-directory: bluemap-addon
        run: npm run check

      - name: Build and test mods
        run: |
          chmod +x gradlew
          ./gradlew test build --no-daemon

      - name: Upload test jars
        uses: actions/upload-artifact@v4
        with:
          name: player-history-object-history
          path: |
            recorder-neoforge/build/libs/*.jar
            bluemap-neoforge/build/libs/*.jar
          if-no-files-found: error
