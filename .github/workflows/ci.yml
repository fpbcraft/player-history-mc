name: CI

on:
  push:
    branches-ignore:
      - "generated/**"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bluemap-addon/package-lock.json
      - name: Install viewer dependencies
        working-directory: bluemap-addon
        run: npm ci
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew test build --no-daemon

      - name: Verify BlueMap mixin config is packaged
        run: |
          jar tf bluemap-neoforge/build/libs/player-history-bluemap-*.jar | grep -qx 'playerhistory_bluemap.mixins.json'

      - name: Publish 0.8.27 test jars to generated branch
        if: github.event_name == 'push' && github.ref_name == 'feat/server-map-overlays'
        run: |
          mkdir -p /tmp/player-history-jars
          cp recorder-neoforge/build/libs/*.jar /tmp/player-history-jars/
          cp bluemap-neoforge/build/libs/*.jar /tmp/player-history-jars/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan generated-jars
          git rm -rf .
          cp /tmp/player-history-jars/*.jar .
          git add *.jar
          git commit -m "Player History 0.8.27 test jars"
          git push --force origin HEAD:refs/heads/generated/player-history-0.8.27

      - name: Upload test jars
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: player-history-object-history
          path: |
            recorder-neoforge/build/libs/*.jar
            bluemap-neoforge/build/libs/*.jar
          if-no-files-found: error
