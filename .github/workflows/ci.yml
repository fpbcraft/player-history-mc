name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bluemap-addon/package-lock.json

      - name: Resolve immutable build version
        run: |
          base="$(sed -n 's/^modVersion=//p' gradle.properties)"
          version="$(python3 scripts/release_version.py dev --base "$base" --sha "$GITHUB_SHA")"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "PLAYER_HISTORY_VERSION=$version" >> "$GITHUB_ENV"
      - name: Install viewer dependencies
        working-directory: bluemap-addon
        run: npm ci
      - name: Check viewer
        working-directory: bluemap-addon
        run: npm run check

      - name: Build and test mods
        run: |
          chmod +x gradlew
          ./gradlew test build --no-daemon

      - name: Upload test jars
        uses: actions/upload-artifact@v4
        with:
          name: player-history-${{ env.RELEASE_VERSION }}
          path: |
            recorder-neoforge/build/libs/*.jar
            bluemap-neoforge/build/libs/*.jar
          if-no-files-found: error
