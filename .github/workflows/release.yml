name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - exact
      exact_version:
        description: Exact MAJOR.MINOR.PATCH when bump is exact
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bluemap-addon/package-lock.json

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          if [[ "${{ github.event_name }}" == "push" ]]; then
            mapfile -t resolved < <(
              python3 scripts/release_version.py --tag "$GITHUB_REF_NAME"
            )
            create_tag=false
          else
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Manual releases must be dispatched from main; got $GITHUB_REF" >&2
              exit 1
            fi

            fallback="$(sed -n 's/^modVersion=//p' gradle.properties | head -n 1)"
            mapfile -t resolved < <(
              python3 scripts/release_version.py                 --bump "${{ inputs.bump }}"                 --fallback "$fallback"                 --exact "${{ inputs.exact_version }}"
            )
            create_tag=true
          fi

          version="${resolved[0]}"
          tag="${resolved[1]}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "create_tag=$create_tag" >> "$GITHUB_OUTPUT"
          echo "PLAYER_HISTORY_VERSION=$version" >> "$GITHUB_ENV"
          echo "Releasing $tag"

      - name: Verify release commit is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release commit $GITHUB_SHA is not reachable from main." >&2
            exit 1
          }

      - name: Verify release is unused
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; releases are immutable." >&2
            exit 1
          fi

      - name: Check release tooling
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Install viewer dependencies
        working-directory: bluemap-addon
        run: npm ci

      - name: Check viewer
        working-directory: bluemap-addon
        run: npm run check

      - name: Build and test mods
        run: |
          chmod +x gradlew
          ./gradlew test build --no-daemon

      - name: Collect release assets
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          recorder="recorder-neoforge/build/libs/player-history-recorder-${VERSION}.jar"
          bluemap="bluemap-neoforge/build/libs/player-history-bluemap-${VERSION}.jar"
          test -f "$recorder"
          test -f "$bluemap"

          cp "$recorder" "$bluemap" release-assets/
          (
            cd release-assets
            sha256sum *.jar > SHA256SUMS.txt
          )

      - name: Create release tag
        if: steps.release.outputs.create_tag == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG"
          git push origin "$TAG"

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" release-assets/*             --verify-tag             --title "$TAG"             --generate-notes

      - name: Upload release build
        uses: actions/upload-artifact@v4
        with:
          name: player-history-${{ steps.release.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
